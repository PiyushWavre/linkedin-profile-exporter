name: Bug report
description: Report a reproducible problem with profile capture, export or download.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not attach exported profiles, contact details, cookies, tokens or other personal data.**
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: 149.0.x
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 / Windows 11 / Linux
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Main profile
        - Experience
        - Education
        - Licences & Certifications
        - Projects
        - Skills
        - Languages
        - Another optional section
        - Export window
        - ZIP download
        - Images
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe what you clicked and what happened. Use synthetic/anonymised examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal/profile data and authentication information from this report.
          required: true
